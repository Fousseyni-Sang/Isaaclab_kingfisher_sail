params:  

  seed: 1 #42

  # environment wrapper clipping
  env:
    clip_actions: 1.0

  algo:
    name: sac

  model:
    name: soft_actor_critic

  network:
    name: hrl_soft_actor_critic
    separate: True
    space:
      continuous:
    mlp:
      units: [512, 256]
      activation: relu
      
      initializer:
        name: default

    hrl_embbeding:
      out_size: 32
      in_size: 10
    log_std_bounds: [-5, 2]

  load_checkpoint: False
  load_path: '' #nn/Ant.pth

  config:
    name: kingfisher_direct_high_level_sac
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    reward_shaper:
      scale_value: 1.0
    max_epochs: 1000
    num_steps_per_episode: 8
    save_best_after: 50
    save_frequency: 50
    gamma: 0.99
    init_alpha: 1.0
    alpha_lr: 0.005
    actor_lr: 0.0005
    critic_lr: 0.0005
    critic_tau: 0.005
    batch_size: 4096
    learnable_temperature: true
    num_seed_steps: 5
    num_warmup_steps: 10
    replay_buffer_size: 1000000
    num_actors: -1